name: RoomSense
options:
  bundleIdPrefix: com.bnelabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  RoomSense:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Info.plist
          - build
          - build-device
          - "**/.DS_Store"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RoomSense
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          RoomSense listens for knocks and household sounds to learn each room's
          acoustic signature.
        NSLocalNetworkUsageDescription: >-
          RoomSense sends numeric acoustic features to your own backend on the
          local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bnelabs.roomsense
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
schemes:
  RoomSense:
    build:
      targets:
        RoomSense: all
    run:
      config: Debug
    archive:
      config: Release
