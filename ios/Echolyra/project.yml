name: Echolyra
options:
  bundleIdPrefix: com.bnelabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  Echolyra:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Info.plist
          - "*.xcodeproj"
          - build
          - build-sim
          - build-device
          - "build*"
          - "**/.DS_Store"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Echolyra
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          Echolyra listens for knocks and household sounds to learn each room's
          acoustic signature.
        NSLocalNetworkUsageDescription: >-
          Echolyra sends recorded audio to your configured backend on the
          local network for acoustic analysis.
        NSMotionUsageDescription: >-
          Echolyra measures walking distance between scan positions to localize room reflections.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bnelabs.roomsense
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
schemes:
  Echolyra:
    build:
      targets:
        Echolyra: all
    run:
      config: Debug
    archive:
      config: Release
